<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

      <stop offset="0%" stop-color="#080812">
        <animate
          attributeName="stop-color"
          values="#080812;#11102b;#080812"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#14142d">
        <animate
          attributeName="stop-color"
          values="#14142d;#21194a;#14142d"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#090914">
        <animate
          attributeName="stop-color"
          values="#090914;#15112c;#090914"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- Name gradient -->
    <linearGradient id="nameGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#ffffff"/>

      <stop offset="50%" stop-color="#9b8cff">
        <animate
          attributeName="stop-color"
          values="#9b8cff;#c1b8ff;#9b8cff"
          dur="3s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ffffff"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0;1 0;-1 0"
        dur="5s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- Glow -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="18"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Small glow -->
    <filter id="smallGlow">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="360"
    fill="url(#background)"/>


  <!-- ================================================= -->
  <!-- LARGE MOVING GLOW -->
  <!-- ================================================= -->

  <circle
    cx="100"
    cy="80"
    r="100"
    fill="#7567ff"
    opacity="0.12"
    filter="url(#glow)">

    <animate
      attributeName="cx"
      values="100;320;100"
      dur="12s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="80;140;80"
      dur="10s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1100"
    cy="250"
    r="120"
    fill="#806fff"
    opacity="0.10"
    filter="url(#glow)">

    <animate
      attributeName="cx"
      values="1100;900;1100"
      dur="14s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="250;180;250"
      dur="11s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- PARTICLES -->
  <!-- ================================================= -->

  <g fill="#a99cff">

    <circle cx="80" cy="70" r="2">
      <animate
        attributeName="cy"
        values="70;45;70"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="240" r="1.5">
      <animate
        attributeName="cy"
        values="240;215;240"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="310" cy="80" r="1.5">
      <animate
        attributeName="cy"
        values="80;105;80"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="70" r="2">
      <animate
        attributeName="cy"
        values="70;45;70"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1040" cy="120" r="1.5">
      <animate
        attributeName="cy"
        values="120;145;120"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1130" cy="210" r="2">
      <animate
        attributeName="cy"
        values="210;185;210"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="250" r="1.5">
      <animate
        attributeName="cy"
        values="250;225;250"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- TOP SMALL LABEL -->
  <!-- ================================================= -->

  <text
    x="600"
    y="65"
    text-anchor="middle"
    font-family="monospace"
    font-size="16"
    letter-spacing="4"
    fill="#9186ff">

    &lt; BUILD • LEARN • SHIP /&gt;

  </text>


  <!-- ================================================= -->
  <!-- NAME -->
  <!-- ================================================= -->

  <text
    x="600"
    y="145"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="700"
    fill="url(#nameGradient)">

    Rakesh Racharla

  </text>


  <!-- ================================================= -->
  <!-- SUBTITLE -->
  <!-- ================================================= -->

  <text
    x="600"
    y="190"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="23"
    font-weight="500"
    fill="#eeeeee">

    Computer Science Engineering • KMIT • 2027

  </text>


  <!-- ================================================= -->
  <!-- ANIMATED LINE -->
  <!-- ================================================= -->

  <line
    x1="330"
    y1="220"
    x2="870"
    y2="220"
    stroke="#7669ff"
    stroke-width="2"
    opacity="0.6">

    <animate
      attributeName="x1"
      values="330;390;330"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x2"
      values="870;810;870"
      dur="5s"
      repeatCount="indefinite"/>

  </line>


  <!-- ================================================= -->
  <!-- TECHNOLOGIES -->
  <!-- ================================================= -->

  <text
    x="600"
    y="265"
    text-anchor="middle"
    font-family="monospace"
    font-size="23"
    font-weight="600"
    fill="#a095ff">

    C++  •  Java  •  Python  •  FastAPI  •  Spring Boot

  </text>


  <!-- ================================================= -->
  <!-- SECOND TECHNOLOGY LINE -->
  <!-- ================================================= -->

  <text
    x="600"
    y="295"
    text-anchor="middle"
    font-family="monospace"
    font-size="16"
    fill="#77738f">

    AI / ML  •  Backend  •  System Design  •  Full Stack

  </text>


  <!-- ================================================= -->
  <!-- MOVING WAVE -->
  <!-- ================================================= -->

  <path
    fill="#17152e"
    opacity="0.95">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"

      values="

      M0 325
      C150 300 260 345 400 320
      C540 295 650 345 800 315
      C950 290 1060 340 1200 310
      L1200 360
      L0 360 Z;

      M0 315
      C150 345 260 305 400 330
      C540 350 650 300 800 325
      C950 345 1060 300 1200 325
      L1200 360
      L0 360 Z;

      M0 325
      C150 300 260 345 400 320
      C540 295 650 345 800 315
      C950 290 1060 340 1200 310
      L1200 360
      L0 360 Z

      "/>

  </path>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect
    x="4"
    y="4"
    width="1192"
    height="352"
    rx="10"
    fill="none"
    stroke="#29263e"
    stroke-width="2"/>

</svg>
